workflows:
  ios-build:
    name: iOS MVP Build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter Packages
        script: |
          flutter packages pub get
      - name: Build iOS IPA (Unsigned)
        script: |
          set -e
          
          # 1. Préparer l'environnement Flutter sans compiler
          flutter build ios --config-only
          
          # 2. Forcer CocoaPods (Flutter a la fâcheuse habitude de supprimer les Pods)
          cd ios
          pod install --repo-update
          cd ..
          
          # 3. Compilation NATIVE avec xcodebuild (contourne les vérifications de Flutter)
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$(PWD)/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | grep -v "note:" # Filtre les avertissements inutiles
          
          # 4. Récupération du build natif
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Erreur: Xcode n'a pas produit le Runner.app"
            exit 1
          fi
          
          # Affichage de la taille pour vérification dans les logs
          echo "Taille de l'application générée :"
          du -sh "$APP_PATH"
          
          # 4. Création propre de l'IPA
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr rayban_mvp_unsigned.ipa Payload
          
          echo "Taille de l'IPA final :"
          ls -lh rayban_mvp_unsigned.ipa
    artifacts:
      - "rayban_mvp_unsigned.ipa"
