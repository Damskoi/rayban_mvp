workflows:
  ios-build:
    name: iOS MVP Build (Unsigned)
    instance_type: mac_mini_m2
    environment:
      flutter: 3.29.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter Packages
        script: |
          flutter packages pub get

      - name: Install Pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS IPA (Unsigned)
        script: |
          set -e
          
          # 1. Compilation native Flutter sans signature pour appareil physique
          flutter build ios --release --no-codesign
          
          # 2. Vérification de la présence de Runner.app
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Erreur: Flutter n'a pas produit le fichier Runner.app"
            exit 1
          fi

          echo "Taille de l'application générée :"
          du -sh "$APP_PATH"

          # 3. Empaquetage du dossier Payload au format .IPA
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr rayban_mvp_unsigned.ipa Payload
          
          # Déplacement du fichier IPA à la racine du projet
          mv rayban_mvp_unsigned.ipa $CM_BUILD_DIR/

          echo "IPA non signé créé avec succès pour Sideloadly !"
    artifacts:
      - "*.ipa"
