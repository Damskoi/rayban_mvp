workflows:
  ios-build:
    name: iOS MVP Build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter Packages
        script: |
          flutter packages pub get
      - name: Build iOS IPA (Unsigned)
        script: |
          # 1. Force l'installation des dépendances natives (Meta SDK)
          cd ios
          pod install --repo-update
          cd ..
          
          # 2. Compilation de l'application sans signature
          flutter build ios --release --no-codesign
          
          # 3. Recherche automatique du dossier .app généré
          APP_PATH=$(find build/ios -name "Runner.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur: Runner.app introuvable !"
            exit 1
          fi
          
          # 4. Création manuelle de l'IPA à la racine du projet
          echo "Application trouvée : $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr rayban_mvp_unsigned.ipa Payload
          echo "IPA généré avec succès !"
    artifacts:
      - "*.ipa"
