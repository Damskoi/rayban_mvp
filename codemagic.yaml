workflows:
  ios-build:
    name: iOS MVP Build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter Packages
        script: |
          flutter packages pub get
      - name: Build iOS IPA (Unsigned)
        script: |
          set -e
          
          # 1. Compilation de l'application (lance pod install automatiquement au bon moment)
          flutter build ios --release --no-codesign
          
          # 3. Récupération du build final officiel
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Erreur: Le build n'a pas produit de Runner.app dans $APP_PATH"
            exit 1
          fi
          
          # Affichage de la taille pour vérification dans les logs
          echo "Taille de l'application générée :"
          du -sh "$APP_PATH"
          
          # 4. Création propre de l'IPA
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr rayban_mvp_unsigned.ipa Payload
          
          echo "Taille de l'IPA final :"
          ls -lh rayban_mvp_unsigned.ipa
    artifacts:
      - "rayban_mvp_unsigned.ipa"
